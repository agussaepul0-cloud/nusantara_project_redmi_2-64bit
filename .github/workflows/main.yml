name: Build Nusantara Project Redmi 2 (Clean, DT2W Default)

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Clear Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Prepare Environment & Dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo_downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -s ~/bin/repo /usr/bin/repo

      - name: Initialize Repo Nusantara
        run: |
          mkdir -p ~/nusantara
          cd ~/nusantara
          git config --global user.name "Agus Saepul Rohman"
          git config --global user.email "agus@example.com"
          repo init -u https://github.com/NusantaraProject-ROM/android_manifest.git -b 11
          
      - name: Sync Source Code
        run: |
          cd ~/nusantara
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync --optimized-fetch --prune

      - name: Clone Device Tree, Vendor, & Kernel Redmi 2 (MSM8916)
        run: |
          cd ~/nusantara
          git clone https://github.com/LineageOS/android_device_xiaomi_msm8916-common device/xiaomi/msm8916-common --depth=1
          git clone https://github.com/LineageOS/android_device_xiaomi_wt88047 device/xiaomi/wt88047 --depth=1
          git clone https://github.com/LineageOS/android_kernel_xiaomi_msm8916 kernel/xiaomi/msm8916 --depth=1
          
      - name: Enable DT2W & System Fixes
        run: |
          cd ~/nusantara
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          
          # Injeksi properti Double Tap to Wake (DT2W) agar aktif default di build system
          TARGET_PROP="device/xiaomi/wt88047/system.prop"
          if [ -f "$TARGET_PROP" ]; then
              echo "persist.sys.sync.dt2w=true" >> "$TARGET_PROP"
              echo "sys.gestures.touchscreen=true" >> "$TARGET_PROP"
          else
              echo "persist.sys.sync.dt2w=true" >> device/xiaomi/wt88047/odm.prop || true
          fi
          
      - name: Start Building (Clean Unrooted + DT2W)
        run: |
          cd ~/nusantara
          source build/envsetup.sh
          lunch nusantara_wt88047-userdebug
          mka bacon -j$(nproc --all)

      - name: Upload Final ROM Result
        uses: actions/upload-artifact@v4
        with:
          name: Nusantara-Redmi2-64bit-Clean-DT2W-ROM
          path: ~/nusantara/out/target/product/wt88047/*.zip
