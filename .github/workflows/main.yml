name: Build Nusantara Project Redmi 2 (Clean, DT2W Default)

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clear Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - name: Prepare Environment & Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 dwarves repo

      - name: Initialize Repo Nusantara
        run: |
          mkdir -p ~/nusantara
          cd ~/nusantara
          git config --global user.name "Agus Saepul Rohman"
          git config --global user.email "agus@example.com"
          repo init -u https://github.com/NusantaraProject-ROM/android_manifest.git -b 11 --depth=1
          
      - name: Sync Source Code
        run: |
          cd ~/nusantara
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync --optimized-fetch --prune

      - name: Clone Device Tree, Vendor, & Kernel Redmi 2 (MSM8916)
        run: |
          cd ~/nusantara
          git clone https://github.com/LineageOS/android_device_xiaomi_msm8916-common device/xiaomi/msm8916-common --depth=1
          git clone https://github.com/LineageOS/android_device_xiaomi_wt88047 device/xiaomi/wt88047 --depth=1
          git clone https://github.com/LineageOS/android_kernel_xiaomi_msm8916 kernel/xiaomi/msm8916 --depth=1
          git clone https://github.com/TheMuppets/proprietary_vendor_xiaomi_msm8916-common vendor/xiaomi/msm8916-common --depth=1 -b lineage-18.1
          git clone https://github.com/TheMuppets/proprietary_vendor_xiaomi_wt88047 vendor/xiaomi/wt88047 --depth=1 -b lineage-18.1

      - name: Free Up Space Before Building (Hapus .repo)
        run: |
          cd ~/nusantara
          rm -rf .repo

      - name: Adapt Device Tree to Nusantara & Enable DT2W
        run: |
          cd ~/nusantara
          sudo ln -sf /usr/bin/python3 /usr/bin/python

          # Konversi otomatis path Lineage ke Nusantara di device tree
          cd device/xiaomi/wt88047
          find . -type f \( -name "*.mk" -o -name "*.bp" \) -exec sed -i 's/vendor\/lineage/vendor\/nusantara/g' {} +
          find . -type f \( -name "*.mk" -o -name "*.bp" \) -exec sed -i 's/lineage_/nusantara_/g' {} +
          find . -type f \( -name "*.mk" -o -name "*.bp" \) -exec sed -i 's/lineage/nusantara/g' {} +
          if [ -f lineage_wt88047.mk ]; then
              mv lineage_wt88047.mk nusantara_wt88047.mk
          fi

          cd ~/nusantara/device/xiaomi/msm8916-common
          find . -type f \( -name "*.mk" -o -name "*.bp" \) -exec sed -i 's/vendor\/lineage/vendor\/nusantara/g' {} +
          find . -type f \( -name "*.mk" -o -name "*.bp" \) -exec sed -i 's/lineage_/nusantara_/g' {} +
          find . -type f \( -name "*.mk" -o -name "*.bp" \) -exec sed -i 's/lineage/nusantara/g' {} +

          cd ~/nusantara
          # Injeksi properti Double Tap to Wake (DT2W)
          TARGET_PROP="device/xiaomi/wt88047/system.prop"
          if [ -f "$TARGET_PROP" ]; then
              echo "persist.sys.sync.dt2w=true" >> "$TARGET_PROP"
              echo "sys.gestures.touchscreen=true" >> "$TARGET_PROP"
          fi

      - name: Start Building (Clean Unrooted + DT2W)
        run: |
          cd ~/nusantara
          export _JAVA_OPTIONS="-Xmx4g"
          source build/envsetup.sh
          lunch nusantara_wt88047-user
          mka bacon -j$(nproc --all)

      - name: Upload Final ROM Result
        uses: actions/upload-artifact@v4
        with:
          name: Nusantara-Redmi2-64bit-Clean-DT2W-ROM
          path: ~/nusantara/out/target/product/wt88047/*.zip
